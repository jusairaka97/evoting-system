<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Election</title>
	<link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
	<div class="dashboard-container">
<h2>Create New Election</h2>

<form th:action="@{/admin/create_election}" method="post">
    <label for="name">Election Name:</label>
    <input type="text" id="name" name="name" required/><br>
    
    <label for="startTime">Start Time:</label>
    <input type="datetime-local" id="startTime" name="startTime" required/><br>
    
    <label for="endTime">End Time:</label>
    <input type="datetime-local" id="endTime" name="endTime" required/><br>
    
    <button type="submit">Create Election</button>
</form>
<div class="dashboard-link">
<a th:href="@{/admin/manage_elections}">Back to Manage Elections</a></div>
	</div>
</body>
</html>
